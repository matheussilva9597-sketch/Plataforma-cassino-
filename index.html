<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casanova VIP - Cassino Moderno</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            casino: { dark: '#0a0e17', card: '#131b2e', hover: '#1c2842', purple: '#7c3aed', gold: '#fbbf24', emerald: '#10b981' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-casino-dark text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-casino-purple selection:text-white">

  <!-- TOPO / HEADER -->
  <header class="bg-casino-card/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <!-- Botão para abrir/fechar o menu no celular -->
      <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-2 text-xl focus:outline-none">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-dice-d20 text-casino-gold text-3xl"></i>
        <span class="text-xl md:text-2xl font-black tracking-wider bg-gradient-to-r from-purple-400 via-pink-500 to-amber-400 bg-clip-text text-transparent">CASANOVA</span>
      </div>
    </div>
    
    <!-- Status do Usuário / Saldo -->
    <div class="flex items-center space-x-3">
      <div class="bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 flex items-center space-x-2">
        <span class="text-[10px] text-slate-400 uppercase font-bold">R$</span>
        <span id="user-balance" class="font-bold text-casino-gold text-xs md:text-sm">100.00</span>
      </div>
      <button onclick="openDepositModal()" class="px-3 py-1.5 bg-casino-emerald hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs transition">+ Depositar</button>
      <button onclick="switchView('admin')" class="px-2.5 py-1.5 bg-red-900/40 text-red-400 border border-red-700/50 rounded-xl text-xs font-bold">Admin</button>
    </div>
  </header>

  <div class="flex flex-grow relative">
    
    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside id="sidebar" class="w-64 bg-casino-card border-r border-slate-800/80 p-4 absolute md:relative z-40 h-[calc(100vh-65px)] transition-all duration-300 transform -translate-x-full md:translate-x-0 shadow-2xl md:shadow-none">
      <div class="space-y-6">
        <div>
          <p class="text-[10px] font-extrabold uppercase tracking-widest text-slate-500 mb-3 px-2">Menu Principal</p>
          <nav class="space-y-1">
            <button onclick="switchView('dashboard'); filterGames('all');" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-casino-purple/20 text-purple-300 font-semibold text-sm border border-casino-purple/30">
              <i class="fa-solid fa-house text-casino-purple"></i><span>Lobby Principal</span>
            </button>
            <button onclick="switchView('dashboard'); filterGames('slots');" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-casino-hover hover:text-white text-sm transition">
              <i class="fa-solid fa-bolt text-amber-400"></i><span>Slots (Caça-Níqueis)</span>
            </button>
            <button onclick="switchView('dashboard'); filterGames('crash');" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-casino-hover hover:text-white text-sm transition">
              <i class="fa-solid fa-plane-up text-red-400"></i><span>Crash Games</span>
            </button>
            <button onclick="switchView('dashboard'); filterGames('live');" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-casino-hover hover:text-white text-sm transition">
              <i class="fa-solid fa-video text-emerald-400"></i><span>Cassino ao Vivo</span>
            </button>
          </nav>
        </div>

        <div>
          <p class="text-[10px] font-extrabold uppercase tracking-widest text-slate-500 mb-3 px-2">Minha Conta</p>
          <nav class="space-y-1">
            <button onclick="openDepositModal()" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-casino-hover hover:text-white text-sm transition">
              <i class="fa-solid fa-wallet text-casino-emerald"></i><span>Depósito PIX</span>
            </button>
            <button onclick="alert('Módulo de saque em desenvolvimento!');" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-casino-hover hover:text-white text-sm transition">
              <i class="fa-solid fa-money-bill-transfer text-blue-400"></i><span>Saque</span>
            </button>
          </nav>
        </div>
      </div>
    </aside>

    <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
    <main class="flex-grow p-4 md:p-6 space-y-8 overflow-x-hidden">

      <!-- LOBBY DE JOGOS (DASHBOARD) -->
      <div id="view-dashboard" class="space-y-8">
        
        <!-- BANNER DE DESTAQUE -->
        <section class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-purple-900/60 via-slate-900 to-slate-950 border border-purple-500/30 p-6 md:p-8 shadow-2xl">
          <div class="relative z-10 max-w-lg space-y-3">
            <span class="inline-block bg-casino-gold/20 text-casino-gold text-[10px] font-black px-3 py-1 rounded-full border border-casino-gold/30 uppercase tracking-widest">Bônus Exclusivo 2026</span>
            <h1 class="text-2xl md:text-4xl font-black text-white leading-tight">Receba até <span class="text-casino-gold">R$ 1.000 + 50 GIROS</span></h1>
            <button onclick="openDepositModal()" class="px-5 py-2.5 bg-casino-emerald hover:bg-emerald-400 text-slate-950 font-black rounded-xl shadow-lg text-sm transition">
              <i class="fa-solid fa-bolt mr-2"></i>Depositar via PIX
            </button>
          </div>
        </section>

        <!-- FILTROS DE CATEGORIA -->
        <section class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none">
          <button onclick="filterGames('all')" class="px-4 py-2 bg-casino-purple text-white font-bold rounded-xl text-xs shrink-0">Todos os Jogos</button>
          <button onclick="filterGames('crash')" class="px-4 py-2 bg-casino-card hover:bg-casino-hover text-slate-300 font-semibold rounded-xl text-xs shrink-0">Crash</button>
          <button onclick="filterGames('slots')" class="px-4 py-2 bg-casino-card hover:bg-casino-hover text-slate-300 font-semibold rounded-xl text-xs shrink-0">Slots</button>
          <button onclick="filterGames('live')" class="px-4 py-2 bg-casino-card hover:bg-casino-hover text-slate-300 font-semibold rounded-xl text-xs shrink-0">Cassino ao Vivo</button>
        </section>

        <!-- GRADE DE JOGOS -->
        <section class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
          <div class="game-card crash bg-casino-card border border-slate-800 rounded-2xl p-3 flex flex-col justify-between">
            <div class="h-32 bg-red-950/40 rounded-xl flex items-center justify-center mb-2">
              <i class="fa-solid fa-plane-up text-3xl text-red-500"></i>
            </div>
            <h3 class="font-bold text-xs text-white">Aviator Crash</h3>
            <button onclick="playGame('Aviator', 10)" class="w-full mt-2 py-1.5 bg-casino-gold text-slate-950 font-black rounded-lg text-xs">Jogar (R$ 10)</button>
          </div>

          <div class="game-card slots bg-casino-card border border-slate-800 rounded-2xl p-3 flex flex-col justify-between">
            <div class="h-32 bg-amber-950/40 rounded-xl flex items-center justify-center mb-2">
              <i class="fa-solid fa-coins text-3xl text-amber-400"></i>
            </div>
            <h3 class="font-bold text-xs text-white">Fortune Tiger</h3>
            <button onclick="playGame('Fortune Tiger', 5)" class="w-full mt-2 py-1.5 bg-casino-gold text-slate-950 font-black rounded-xl text-xs">Jogar (R$ 5)</button>
          </div>

          <div class="game-card live bg-casino-card border border-slate-800 rounded-2xl p-3 flex flex-col justify-between">
            <div class="h-32 bg-emerald-950/40 rounded-xl flex items-center justify-center mb-2">
              <i class="fa-solid fa-dharmachakra text-3xl text-emerald-400"></i>
            </div>
            <h3 class="font-bold text-xs text-white">Roleta Brasileira</h3>
            <button onclick="playGame('Roleta', 10)" class="w-full mt-2 py-1.5 bg-casino-gold text-slate-950 font-black rounded-lg text-xs">Jogar (R$ 10)</button>
          </div>
        </section>

      </div>

      <!-- PAINEL ADMINISTRATIVO -->
      <div id="view-admin" class="hidden space-y-6">
        <div class="flex justify-between items-center bg-red-950/30 border border-red-500/30 p-6 rounded-2xl">
          <div>
            <h1 class="text-2xl font-black text-white">Painel Administrativo da Casa</h1>
            <p class="text-xs text-slate-400">Controle de ganhos da casa e dados gerais.</p>
          </div>
          <button onclick="switchView('dashboard')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold">Voltar ao Cassino</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-casino-card p-6 rounded-2xl border border-slate-800">
            <p class="text-slate-400 text-xs font-bold uppercase">Lucro da Casa (GGR)</p>
            <p class="text-3xl font-black text-casino-emerald mt-2">R$ <span id="admin-profit">0.00</span></p>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    let balance = 100.00;
    let houseProfit = 0.00;

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('-translate-x-full');
    }

    function switchView(view) {
      document.getElementById('view-dashboard').classList.add('hidden');
      document.getElementById('view-admin').classList.add('hidden');
      if (view === 'dashboard') document.getElementById('view-dashboard').classList.remove('hidden');
      if (view === 'admin') document.getElementById('view-admin').classList.remove('hidden');
    }

    function filterGames(category) {
      const cards = document.querySelectorAll('.game-card');
      cards.forEach(card => {
        if (category === 'all' || card.classList.contains(category)) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    function openDepositModal() {
      balance += 50.00;
      document.getElementById('user-balance').innerText = balance.toFixed(2);
      alert('Depósito simulado com sucesso (+ R$ 50,00)!');
    }

    function playGame(gameName, cost) {
      if (balance < cost) {
        alert('Saldo insuficiente!');
        return;
      }
      balance -= cost;
      if (Math.random() > 0.5) {
        let prize = cost * 2;
        balance += prize;
        alert(`Ganhou R$ ${prize.toFixed(2)} no ${gameName}!`);
      } else {
        houseProfit += cost;
        document.getElementById('admin-profit').innerText = houseProfit.toFixed(2);
        alert(`Perdeu no ${gameName}. Tente novamente!`);
      }
      document.getElementById('user-balance').innerText = balance.toFixed(2);
    }
  </script>
</body>
</html>
